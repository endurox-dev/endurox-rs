[package]
name = "endurox-rs"
version = "0.1.333"
edition = "2021"

# REQUIRED by crates.io
description = "Dev middleware utilities for Enduro/X projects (Rust bindings)."
license = "AGPL-3.0"   # pick one license or an SPDX expression

# Strongly recommended
readme = "README.md"
repository = "https://github.com/endurox-dev/endurox-rs"
homepage = "https://www.mavimax.com"
documentation = "https://www.endurox.org/dokuwiki"
keywords = ["middleware", "development", "endurox", "bindings", "rust"]
categories = ["development-tools"]
exclude = [
    "CLAUDE.md",
    "target/**",
    "endurox-rs-derive/target/**",
]

[dependencies]
endurox-rs-derive = { version = "0.1.0", path = "endurox-rs-derive" }
libc = "0.2"
tokio = { version = "1", features = ["net", "time"], optional = true }

[build-dependencies]
bindgen = "0.70"        # pin a version for stability
cc = "1.0"
pkg-config = "0.3"

[features]
# default = []     # default: !Send & !Sync
ctx-send = []      # enable to make AtmiCtx: Send & !Sync
tokio = ["dep:tokio"] # enable Tokio-native async helpers for pollable Enduro/X builds

[[test]]
name = "atmictx_tests"
path = "tests/00_unittest/atmictx_tests.rs"

[[test]]
name = "ubf_tests"
path = "tests/00_unittest/ubf_tests.rs"

[[test]]
name = "nstd_tests"
path = "tests/00_unittest/nstd_tests.rs"
